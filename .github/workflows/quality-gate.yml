name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:static

  browser-locale:
    name: ${{ matrix.browser.name }}-${{ matrix.locale }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # The Cartesian product keeps the workflow compact while GitHub still reports
      # every browser/locale pair as its own required check.
      matrix:
        browser:
          - name: chromium
            install: chromium
            includeEdge: false
          - name: firefox
            install: firefox
            includeEdge: false
          - name: webkit
            install: webkit
            includeEdge: false
          - name: edge
            install: msedge
            includeEdge: true
        locale: [en-CA, fr-CA]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ${{ matrix.browser.install }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser.install }}
      - name: Run ${{ matrix.browser.name }}-${{ matrix.locale }}
        run: pnpm exec playwright test --project=${{ matrix.browser.name }}-${{ matrix.locale }}
        env:
          TEST_ENV: self-contained
          LIVE_SUITE: framework
          PLAYWRIGHT_INCLUDE_EDGE: ${{ matrix.browser.includeEdge }}
      - name: Upload ${{ matrix.browser.name }}-${{ matrix.locale }} artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser.name }}-${{ matrix.locale }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [static-checks, browser-locale]
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser and locale check
        run: |
          test "${{ needs.static-checks.result }}" = "success"
          test "${{ needs.browser-locale.result }}" = "success"
